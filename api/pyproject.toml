[project]
name = "personality_classifier"
version = "0.1.0"
description = "Predicts personality type based on user text input using a trained machine learning model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "joblib>=1.5.3",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn==1.5.0",
    "uvicorn>=0.46.0",
]
